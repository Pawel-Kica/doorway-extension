<!doctype html>
<!-- Shown before a Think twice website opens (Settings > Distractions), see js/blocker.js and js/ask.js.
     During super lock (js/lock.js) it says until when the site is locked instead of asking. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Think twice</title>
    <link rel="icon" href="icons/icon48.png" />
    <style>
      html, body { height: 100%; margin: 0; }
      html { background: #000; }
      /* Nothing shows until js/ask.js has filled in the site, else the question jumps when the name lands */
      body:has(.site:empty) { visibility: hidden; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3rem;
        color: #fff; user-select: none;
        font: 500 2.1rem -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      img { width: 134px; height: 134px; }
      [hidden] { display: none !important; }
      section { display: flex; flex-direction: column; align-items: center; gap: 2rem; }
      p { margin: 0; padding: 0 1.5rem; text-align: center; text-wrap: balance; }
      /* The site is highlighted in the icon's warm light */
      .site { color: #fde9b5; }
      .answers { display: flex; gap: 0.875rem; }
      button {
        min-width: 9rem; padding: 0.875rem 1.75rem; border: 0; border-radius: 1000rem; outline: none;
        background: hsl(0 0% 100% / 0.12); color: #fff; font: inherit; font-size: 1.25rem; cursor: pointer;
      }
      button:hover { background: hsl(0 0% 100% / 0.2); }
      .primary { background: hsl(226 42% 30%); }
      .primary:hover { background: hsl(226 42% 36%); }
      /* The site's list, always there: "You wanted to:", + adds a note in place as the next row, so nothing moves when
         Enter keeps it. One height for empty, adding and a few notes; it grows only once the list outgrows it. */
      .notes {
        width: min(44rem, 86vw); box-sizing: border-box; display: flex; flex-direction: column; gap: 0.5em;
        padding: 22px 30px; border-radius: 28px; background: hsl(0 0% 100% / 0.08); font-size: 1.6rem; text-align: left;
      }
      .notes header { display: flex; align-items: center; justify-content: space-between; color: hsl(0 0% 100% / 0.7); }
      .notes .add {
        width: 42px; height: 42px; min-width: 0; margin: -4px -10px -4px 0; padding: 0; border-radius: 50%;
        background: none; font-size: 2rem; line-height: 42px; color: hsl(0 0% 100% / 0.7);
      }
      .notes .add:hover { background: hsl(0 0% 100% / 0.12); color: #fff; }
      .items { min-height: 6.8em; display: flex; flex-direction: column; gap: 0.5em; }
      .notes .note {
        display: flex; align-items: baseline; gap: 0.5em; min-width: 0; padding: 0; border-radius: 0;
        background: none; font: inherit; text-align: left; overflow-wrap: anywhere;
      }
      .note::before {
        content: ""; width: 0.8em; height: 0.8em; flex-shrink: 0; border-radius: 50%;
        box-shadow: inset 0 0 0 2px #fde9b5; translate: 0 0.1em;
      }
      .note:hover::before, .note.done::before { background: #fde9b5; }
      .notes .done { color: hsl(0 0% 100% / 0.5); text-decoration: line-through; }
      .note.draft::before { box-shadow: inset 0 0 0 2px hsl(0 0% 100% / 0.3); }
      .draft input {
        flex: 1; min-width: 0; padding: 0; border: 0; outline: none; background: none;
        color: #fff; font: inherit; caret-color: #fde9b5;
      }
      /* Empty list: a card inside the card */
      .empty {
        flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.3em; padding: 18px;
        border-radius: 16px; background: hsl(0 0% 100% / 0.05); color: hsl(0 0% 100% / 0.5); text-align: center;
      }
      .emoji { color: #fff; }
    </style>
  </head>
  <body>
    <img src="icons/icon512.png" alt="" />
    <!-- Keys answer (y, s, n or Enter, see js/ask.js), the buttons stay out of the Tab order. -->
    <section>
      <p id="question">Do you really need <span class="site"></span>?</p>
      <p id="locked" hidden><span class="site"></span> is super locked <span id="until"></span>.</p>
      <div class="notes">
        <header>You wanted to:<button class="add" title="Add" tabindex="-1">+</button></header>
        <div class="items"></div>
      </div>
      <div class="answers" id="answers">
        <button id="yes" tabindex="-1">Yes</button>
        <button id="save" tabindex="-1">Save</button>
        <button id="no" class="primary" tabindex="-1">No</button>
      </div>
      <div class="answers" id="lock-answers" hidden>
        <button id="ok" class="primary" tabindex="-1">OK</button>
      </div>
    </section>
    <script type="module" src="js/ask.js"></script>
  </body>
</html>
